# ~/.config/tmux/tmux.conf

# Set Tmux Term to something more plugin friendly.
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-kitty:RGB"

# Ensure tmux understands we want to be using zsh.
set -g default-shell "/usr/bin/zsh"

# Adjust some settings for tilish.
set -s escape-time 0
set -g base-index 1

# Rebind the Tmux Prefix key from C-b to C-a.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Rebind Describe key from / to k.
unbind /
bind k 'command-prompt -k -p key { list-keys -1N "%%" }'

# Rebind Win Split Vert.
unbind \"
bind \' split-window -h

# Rebind Win Split Horiz.
unbind \%
bind / split-window -v

# Bind help to F1.
bind F1 list-keys -N
bind F2 list-keys
bind F3 list-commands
bind F4 show -gw

# Vi mode
set-window-option -g mode-keys vi

# Vi like visual copy.
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Quick edit tmux config.
bind-key M split-window -v "nvim ~/.config/tmux/tmux.conf"

# Enable mouse scrolling
set -g mouse on

# List of plugins
set -g @plugin '/home/ld/.config/tmux/plugins/tmux-plugins.tpm'
set -g @plugin '/home/ld/.config/tmux/plugins/tmux-plugins.tmux-sensible'
set -g @plugin '/home/ld/.config/tmux/plugins/tmux-plugins.tmux-yank'
set -g @plugin '/home/ld/.config/tmux/plugins/tmux-plugins.tmux-resurrect'
set -g @plugin '/home/ld/.config/tmux/plugins/tmux-plugins.tmux-continuum'
set -g @plugin '/home/ld/.config/tmux/plugins/crispyconductor.tmux-copy-toolkit'
set -g @plugin '/home/ld/.config/tmux/plugins/roosta.tmux-fuzzback'
set -g @plugin '/home/ld/.config/tmux/plugins/jaclu.tmux-power-zoom'
set -g @plugin '/home/ld/.config/tmux/plugins/tmux-plugins.tmux-logging'
set -g @plugin '/home/ld/.config/tmux/plugins/o0th.tmux-nova'
set -g @plugin '/home/ld/.config/tmux/plugins/tmux-plugins.tmux-cpu'

set -g @plugin '/home/ld/.config/tmux/plugins/jabirali.tmux-tilish'
set -g @plugin '/home/ld/.config/tmux/plugins/sunaku.tmux-navigate'

#set -g @plugin '/home/ld/.config/tmux/plugins/tmux-plugins.tmux-battery'
#set -g @plugin '/home/ld/.config/tmux/plugins/imomaliev.tmux-keyboard-layout'
#set -g @plugin '/home/ld/.config/tmux/plugins/thewtex.tmux-mem-cpu-load'


source-file "$HOME/.config/tmux/themes/mgk-tmux-theme.conf"

#set -g status-interval 2
#set -g status-right "#S #[fg=green,bg=black]#(tmux-mem-cpu-load --colors --interval 2)#[default]"
#set -g status-right-length 60

####
# Tmux Continuum / Resurrect Session Management
# Change session save interval from 15 minutes to 1 minute.
set -g @continuum-save-interval '1'

# Enable auto-session restore using Tmux-Continuum
set -g @continuum-restore 'on'

# Change resurrect save dir.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'

####
# Clipboard Stuff
####
# tmux copy toolkit copy command
set -g @copytk-no-default-binds on
set -g @copytk-copy-command 'pee "xsel -ib" "tmux load-buffer -"'
set -g @copytk-color-highlight 'black:red'

# Custom Bindings for Copy Toolkit
## copytk prefix: easymotion action bindings
TK_DIR=~/.local/opt/git/git.mgk.one/tmux/crispyconductor.tmux-copy-toolkit

bind-key -T copytk s run-shell -b "python3 $TK_DIR/copytk.py easymotion-search --search-nkeys 1"
bind-key -T copytk S run-shell -b "python3 $TK_DIR/copytk.py easymotion-search --search-nkeys 2"
bind-key -T copytk k run-shell -b "python3 $TK_DIR/copytk.py easymotion-lines --search-direction backward"
bind-key -T copytk j run-shell -b "python3 $TK_DIR/copytk.py easymotion-lines --search-direction forward"
bind-key -T copytk n run-shell -b "python3 $TK_DIR/copytk.py easymotion-lines"

## copy mode: easymotion action bindings
bind-key -T copy-mode-vi s run-shell -b "python3 $TK_DIR/copytk.py easymotion-search --search-nkeys 1"
bind-key -T copy-mode s run-shell -b "python3 $TK_DIR/copytk.py easymotion-search --search-nkeys 1"

## copytk prefix: easycopy action bindings
bind-key -T copytk y run-shell -b "python3 $TK_DIR/copytk.py easycopy --search-nkeys 1"
bind-key -T copytk Y run-shell -b "python3 $TK_DIR/copytk.py easycopy --search-nkeys 2"

## tmux prefix: easycopy action bindings
bind-key -T prefix S run-shell -b "python3 $TK_DIR/copytk.py easycopy --search-nkeys 1"

# tmux prefix: linecopy action bindings
bind-key -T prefix W run-shell -b "python3 $TK_DIR/copytk.py linecopy"

# tmux prefix: quickcopy action bindings
bind-key -T prefix Q run-shell -b "python3 $TK_DIR/copytk.py quickcopy"

# tmux prefix: quickopen action bindings
bind-key -T prefix O run-shell -b "python3 $TK_DIR/copytk.py quickopen"

# bindings to enter copytk prefix
bind-key -T copy-mode-vi S switch-client -T copytk
bind-key -T copy-mode S switch-client -T copytk

####
# FZF Finder
####
# Bound to ? currently
#set -g @fuzzback-bind s
set -g @fuzzback-popup 0
set -g @fuzzback-fzf-bind 'ctrl-y:execute-silent(echo -n {3..} | pee "xsel -ib" "tmux load-buffer -" )+abort'

####
## Tilish Settings
####
set -g @tilish-default 'main-vertical'
set -g @tilish-navigate 'on'

# Enable dmenu with alt-d
set -g @tilish-dmenu 'on'

# Set logging path
set -g @logging-path "~/.local/share/tmux/"

## Run Fuzzback
#run-shell ~/.local/opt/git/git.mgk.one/tmux/roosta.tmux-fuzzback/fuzzback.tmux
#
## Run Continuum
#run-shell ~/.local/opt/git/git.mgk.one/tmux/tmux-plugins.tmux-continuum/continuum.tmux

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tmux-plugins.tpm/tpm'
